<!--
  ScholarLink 이메일 푸터 (내용만 흰 박스, 검색창 우측 빈공간 제거)
  - 사이즈: ~3.0KB
  - 검색창: 검색 버튼이 우측 끝까지 파란 박스로 채움 (빈공간 없음)
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
  style="margin:0;padding:24px 16px;background-color:transparent;">
  <tr>
    <td align="center">

      <!-- 흰 박스 컨테이너 -->
      <table role="presentation" width="480" cellpadding="0" cellspacing="0" border="0"
        style="max-width:480px;width:100%;background-color:#ffffff;border:1px solid #e2e8f0;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">

        <!-- ① 브랜드 -->
        <tr>
          <td align="center" style="padding:28px 24px 16px 24px;">
            <span style="font-size:18px;font-weight:700;color:#0f172a;letter-spacing:-0.3px;">ScholarLink</span>
          </td>
        </tr>

        <!-- ② 검색창 (검색 버튼이 우측 끝까지 채움) -->
        <tr>
          <td align="center" style="padding:0 24px 16px 24px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
              style="background-color:#ffffff;border:1px solid #cbd5e1;border-radius:8px;overflow:hidden;">
              <tr>
                <!-- 돋보기 -->
                <td width="40" align="center" valign="middle" style="padding:11px 0;color:#94a3b8;font-size:15px;line-height:1;">
                  &#x1F50D;
                </td>
                <!-- placeholder (남는 공간 차지) -->
                <td valign="middle" style="padding:11px 12px 11px 8px;font-size:13px;color:#94a3b8;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                  DOI, PMID 또는 arXiv ID 입력&hellip;
                </td>
                <!-- 검색 버튼 (검색창 우측 끝에 파란 박스로 딱 붙음) -->
                <td width="88" align="center" valign="middle"
                  style="padding:11px 0;background-color:#2563eb;border-radius:0 7px 7px 0;">
                  <a href="https://wheeljah.github.io/SC_link/"
                    style="color:#ffffff;text-decoration:none;font-size:13px;font-weight:600;line-height:1.4;">
                    검색
                  </a>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- ③ 안내텍스트 -->
        <tr>
          <td align="center" style="padding:0 28px 20px 28px;font-size:13px;line-height:1.6;color:#64748b;">
            오픈액세스 학술자료를 DOI&middot;PMID&middot;arXiv로 한 번에 검색하고 무료로 받아보세요.
          </td>
        </tr>

        <!-- ④ 홈으로 가기 버튼 -->
        <tr>
          <td align="center" style="padding:0 24px 28px 24px;">
            <a href="https://wheeljah.github.io/SC_link/"
              style="display:inline-block;padding:10px 24px;background-color:#2563eb;color:#ffffff;text-decoration:none;border-radius:6px;font-size:14px;font-weight:600;">
              홈으로 가기 &rarr;
            </a>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
